name: "Release"

on:
  release:
    types:
      - "published"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v6.0.2"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/denon_marantz_avr"
          zip denon_marantz_avr.zip -r ./

      - name: "Create the release and upload the ZIP file"
        uses: "softprops/action-gh-release@v3.0.3"
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ github.workspace }}/custom_components/denon_marantz_avr/denon_marantz_avr.zip
